# Buddy echo cancellation (2026-09-28). Everything bigbuddy plays for Buddy (voice, jukebox, movies) goes to
# "buddy_aec_sink", which forwards to HDMI and is the AEC reference; Buddy listens on "buddy_aec_source"
# (reSpeaker XVF3800 since 2026-10-05, playback subtracted). Only echo cancellation; no AGC / noise suppression.
# Undo: delete this file, `systemctl --user restart pipewire pipewire-pulse wireplumber`.
context.modules = [
  # reSpeaker XVF3800 (4 mics, beamformed on the board; USB firmware 2.0.6 sends 2 processed channels, read from the
  # device 2026-10-05): left = AUDIO_MGR_OP_L (8,0) "user chosen" = auto-select beam with the conference post-
  # processing (noise suppression, AGC); right = AUDIO_MGR_OP_R (7,3) = ASR output of the auto-select beam.
  # Buddy (wake word + Whisper) gets the RIGHT channel only, as the mono source "xvf_asr".
  { name = libpipewire-module-loopback
    args = {
      node.description = "XVF3800 ASR beam"
      capture.props = {
        node.name = "xvf_asr_capture"
        target.object = "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993701262800721-00.analog-stereo"
        audio.channels = 1
        audio.position = [ FR ]
        stream.dont-remix = true
        node.passive = true
      }
      playback.props = {
        node.name = "xvf_asr"
        media.class = "Audio/Source"
        audio.channels = 1
        audio.position = [ MONO ]
      }
    }
  }
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      aec.args = {
        webrtc.gain_control = false
        webrtc.noise_suppression = false
        webrtc.high_pass_filter = true
      }
      capture.props = {
        node.name = "buddy_aec_capture"
        # mic = "xvf_asr" (defined below): the reSpeaker XVF3800's speech-recognition beam (owner 2026-10-05).
        # The array's own echo canceller has no reference here (Buddy plays through the Evo 150, not through the
        # array's output), so this PipeWire canceller stays.
        target.object = "xvf_asr"
        audio.channels = 1
        audio.position = [ MONO ]
        node.passive = true
      }
      source.props = {
        node.name = "buddy_aec_source"
        node.description = "Buddy mic (echo-cancelled)"
        audio.channels = 1
        audio.position = [ MONO ]
      }
      sink.props = {
        node.name = "buddy_aec_sink"
        node.description = "Buddy output (AEC reference)"
      }
      playback.props = {
        node.name = "buddy_aec_playback"
        # was HDMI (TV): target.object = "alsa_output.pci-0000_01_00.1.hdmi-stereo"
        target.object = "alsa_output.usb-Cambridge_Audio_Evo_150_00403a6e-00.analog-stereo"   # Evo 150 USB (owner 2026-10-01)
        node.passive = true
      }
    }
  }
]
