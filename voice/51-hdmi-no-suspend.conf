# Keep the HDMI (Samsung) output from suspending: after idle-suspend the display needs ~0.3-0.5 s to re-lock,
# which cut off the start of Buddy's speech (2026-09-28). Remove this file + restart wireplumber to undo.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
