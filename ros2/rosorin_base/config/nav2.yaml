# Nav2 1.1.20 nav2_bringup/params/nav2_params.yaml (apt) with ROSOrin changes (docs/navigation.md):
# use_sim_time false; AMCL base_link + OmniMotionModel + laser 0.12..8 m; odom /odometry/filtered;
# DWB holonomic, NO reverse (min_vel_x 0, smoother min vx 0: LiDAR rear ~65 deg blind), 0.35 m/s forward,
# 0.08 m/s strafe, 1.0 rad/s; footprint polygon from chassis model; BT without BackUp and without Spin;
# goal tolerance 0.2 m / 0.3 rad. (Header corrected 2026-10-02: it still listed the 09-28 values.)
amcl:
  # NVIDIA Nova Carter AMCL tuning (Isaac ROS 3.2 "AMCL Tuning"): beam model, sigma_hit 0.1, z weights 0.5/0.05/0.4/
  # 0.05, max_beams 360, odometry noise 0.1. Ours: omni motion model (mecanum), COIN-D6 range 0.12-8 m.
  # The starting pose comes from Isaac ROS Occupancy Grid Localizer (/initialpose), not from a saved pose.
  ros__parameters: {use_sim_time: false, alpha1: 0.1, alpha2: 0.1, alpha3: 0.1, alpha4: 0.1,
    alpha5: 0.1, base_frame_id: base_link, beam_skip_distance: 0.5, beam_skip_error_threshold: 0.9,
    beam_skip_threshold: 0.3, do_beamskip: false, global_frame_id: map, lambda_short: 0.1,
    laser_likelihood_max_dist: 2.0, laser_max_range: 8.0, laser_min_range: 0.12, laser_model_type: beam,
    max_beams: 360, max_particles: 2000, min_particles: 500, odom_frame_id: odom, pf_err: 0.05,
    pf_z: 0.99, recovery_alpha_fast: 0.0, recovery_alpha_slow: 0.0, resample_interval: 1,
    robot_model_type: 'nav2_amcl::OmniMotionModel', save_pose_rate: 0.5, sigma_hit: 0.1,
    tf_broadcast: true, transform_tolerance: 1.0, update_min_a: 0.2, update_min_d: 0.25,
    z_hit: 0.5, z_max: 0.05, z_rand: 0.4, z_short: 0.05, scan_topic: scan}
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # ms the tree waits for a service answer (stock 20). Measured 2026-10-05 on this robot, navigation idle: a global
    # costmap clear takes 25-82 ms, a local one up to 412 ms. In the first floor run through the always-on stack every
    # clear timed out (43 times in 2 min) and the stale obstacle cells around the robot never went away.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node,
      nav2_smooth_path_action_bt_node, nav2_follow_path_action_bt_node, nav2_spin_action_bt_node,
      nav2_wait_action_bt_node, nav2_assisted_teleop_action_bt_node, nav2_back_up_action_bt_node,
      nav2_drive_on_heading_bt_node, nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node,
      nav2_goal_reached_condition_bt_node, nav2_goal_updated_condition_bt_node, nav2_globally_updated_goal_condition_bt_node,
      nav2_is_path_valid_condition_bt_node, nav2_initial_pose_received_condition_bt_node,
      nav2_reinitialize_global_localization_service_bt_node, nav2_rate_controller_bt_node,
      nav2_distance_controller_bt_node, nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node,
      nav2_truncate_path_local_action_bt_node, nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node,
      nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node, nav2_path_expiring_timer_condition, nav2_distance_traveled_condition_bt_node,
      nav2_single_trigger_bt_node, nav2_goal_updated_controller_bt_node, nav2_is_battery_low_condition_bt_node,
      nav2_navigate_through_poses_action_bt_node, nav2_navigate_to_pose_action_bt_node,
      nav2_remove_passed_goals_action_bt_node, nav2_planner_selector_bt_node, nav2_controller_selector_bt_node,
      nav2_goal_checker_selector_bt_node, nav2_controller_cancel_bt_node, nav2_path_longer_on_approach_bt_node,
      nav2_wait_cancel_bt_node, nav2_spin_cancel_bt_node, nav2_back_up_cancel_bt_node,
      nav2_assisted_teleop_cancel_bt_node, nav2_drive_on_heading_cancel_bt_node, nav2_is_battery_charging_condition_bt_node]
    default_nav_to_pose_bt_xml: /home/burgerbarn/ros2_ws/install/rosorin_base/share/rosorin_base/bt/navigate_no_backup.xml
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters: {use_sim_time: false}
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters: {use_sim_time: false}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.25,
      movement_time_allowance: 10.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker',
      xy_goal_tolerance: 0.2, yaw_goal_tolerance: 0.3}     # 0.08 made it dither a minute 10 cm from a goal (2026-10-02)
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false   # was true (a debugging leftover); no measurable effect on load (617 vs 656 late loops)
      min_vel_x: 0.0
      max_vel_x: 0.35          # owner 2026-10-01: faster (was 0.2). (Line lost 2026-10-02 in commit 2b2dc07: the
                               # controller then had NO forward speed and drove sideways only - found from /evaluation)
      # forward first (2026-10-02): the robot stalled strafing onto the rug edge (owner: it gets over it at an angle,
      # not sideways) and the camera/nvblox only see ahead. Sideways stays, as a small correction; pure strafing is
      # penalised by Nav2's PreferForward critic (NVIDIA's reference controller also prefers forward).
      min_vel_y: -0.08
      max_vel_y: 0.08
      max_vel_theta: 1.0
      min_speed_xy: 0.1       # rug: slower commands stall (45 % at 0.1, none below)
      max_speed_xy: 0.35
      min_speed_theta: 0.4    # rug: slow turns stall
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 2.0
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -2.0
      # Sampled trajectories = vx x vy x vtheta. Was 20 x 5 x 20 = 2000: the controller used 95 % of one core and missed
      # its 20 Hz loop on nearly every cycle (656 late loops in 36 s, measured on the robot 2026-10-05 with
      # scripts/tests/nav_load_test.sh, wheels disabled); a whole run then failed on stale TF. 10 x 5 x 10 = 500: 31 %
      # of a core, 2 late loops. Resolution: 0.035 m/s forward, 0.2 rad/s turn.
      vx_samples: 10
      vy_samples: 5
      vtheta_samples: 10
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.2
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      # ObstacleFootprint (not BaseObstacle): the whole footprint is checked, not the centre point - it had parked its
      # nose 6 cm from a chair leg (2026-10-02)
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist,
        GoalDist, PreferForward]
      PreferForward.scale: 5.0
      PreferForward.penalty: 1.0
      PreferForward.strafe_x: 0.1
      PreferForward.strafe_theta: 0.2
      PreferForward.theta_scale: 0.0
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    odom_topic: /odometry/filtered
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: [voxel_layer, nvblox_layer, inflation_layer]
      # NVIDIA nvblox: obstacles 4.5-60 cm above the floor seen by the depth camera (what the LiDAR plane misses)
      nvblox_layer: {plugin: 'nvblox::nav2::NvbloxCostmapLayer', enabled: true, nav2_costmap_global_frame: odom,
        nvblox_map_slice_topic: /nvblox_node/static_map_slice, convert_to_binary_costmap: true}
      # no keepout here: before AMCL converges it lands at a wrong place, under the robot, and Spin refuses
      # ("Collision Ahead", run 2 2026-10-01). Keepout lives in the global costmap = every planned path.
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0,
        inflation_radius: 0.55}
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan          # depth REMOVED 2026-09-30: flooded the global costmap (38 % lethal) -> baseline first; depth gets its own test
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          obstacle_max_range: 2.5, obstacle_min_range: 0.0}
        # depth camera on the arm (2026-09-29): sees what the LiDAR plane misses (low boxes, chair legs, anything
        # under 10 cm). Heights in odom (= base_link height, floor ~ -0.025): obstacles from 2 cm above base_link
        # (~4.5 cm above the floor; lower/flat things = the vision floor-item check). Eye-in-hand: TF follows the arm.
        depth: {topic: /aurora/points2, data_type: PointCloud2, marking: true, clearing: true,
          min_obstacle_height: 0.02, max_obstacle_height: 0.6, obstacle_max_range: 2.5, obstacle_min_range: 0.2,
          raytrace_max_range: 3.0, raytrace_min_range: 0.2, expected_update_rate: 0.0}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      always_send_full_costmap: true
      footprint: '[[0.155, 0.12], [0.155, -0.115], [-0.15, -0.115], [-0.15, 0.12]]'
      footprint_padding: 0.01
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, nvblox_layer, inflation_layer]
      nvblox_layer: {plugin: 'nvblox::nav2::NvbloxCostmapLayer', enabled: true, nav2_costmap_global_frame: map,
        nvblox_map_slice_topic: /nvblox_node/static_map_slice, convert_to_binary_costmap: true}
      filters: [keepout_filter]          # room keepout (owner 2026-10-01): outside the room walls = lethal
      keepout_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /costmap_filter_info}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan          # depth REMOVED 2026-09-30: flooded the global costmap (38 % lethal) -> baseline first; depth gets its own test
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          obstacle_max_range: 2.5, obstacle_min_range: 0.0}
        # depth camera on the arm (2026-09-29): sees what the LiDAR plane misses (low boxes, chair legs, anything
        # under 10 cm). Heights in odom (= base_link height, floor ~ -0.025): obstacles from 2 cm above base_link
        # (~4.5 cm above the floor; lower/flat things = the vision floor-item check). Eye-in-hand: TF follows the arm.
        depth: {topic: /aurora/points2, data_type: PointCloud2, marking: true, clearing: true,
          min_obstacle_height: 0.02, max_obstacle_height: 0.6, obstacle_max_range: 2.5, obstacle_min_range: 0.2,
          raytrace_max_range: 3.0, raytrace_min_range: 0.2, expected_update_rate: 0.0}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0,
        inflation_radius: 0.55}
      always_send_full_costmap: true
      footprint: '[[0.155, 0.12], [0.155, -0.115], [-0.15, -0.115], [-0.15, 0.12]]'
      footprint_padding: 0.01
map_server:
  ros__parameters: {use_sim_time: false, yaml_filename: ''}
map_saver:
  ros__parameters: {use_sim_time: false, save_map_timeout: 5.0, free_thresh_default: 0.25,
    occupied_thresh_default: 0.65, map_subscribe_transient_local: true}
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.5, use_astar: false,
      allow_unknown: true}
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10,
      max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: nav2_behaviors/Spin}       # loaded, NOT in the tree (bt/navigate_no_backup.xml says why)
    # Not in the tree either. Ramps set so that any use starts and stops like every other motion: with the stock
    # 0.0 limits Nav2 1.1.20 sends the commanded speed as a step (drive_on_heading.hpp). minimum_speed = the rug
    # stall speed (DWB min_speed_xy).
    backup: {plugin: nav2_behaviors/BackUp, acceleration_limit: 0.5, deceleration_limit: -0.5, minimum_speed: 0.1}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading, acceleration_limit: 0.5, deceleration_limit: -0.5,
      minimum_speed: 0.1}
    wait: {plugin: nav2_behaviors/Wait}
    assisted_teleop: {plugin: nav2_behaviors/AssistedTeleop}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters: {use_sim_time: false}
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true,
      waypoint_pause_duration: 200}
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.35, 0.08, 1.0]
    min_velocity: [0.0, -0.08, -1.0]     # NO reverse in navigation: the rear is blind. A BackUp recovery added 2026-10-02
                                         # backed it into a screen door within the hour - removed.
    max_accel: [0.5, 0.5, 2.0]
    max_decel: [-0.5, -0.5, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Room keepout mask (owner 2026-10-01): maps/room_20260928_keepout.yaml served on /keepout_filter_mask
filter_mask_server:
  ros__parameters:
    use_sim_time: False
    topic_name: keepout_filter_mask
    frame_id: map
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0
