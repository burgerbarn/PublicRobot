# rf2o laser odometry (built from source in ~/ext_ws). publish_tf false: the EKF owns odom->base_link. Its POSE
# translation is reversed -> rosorin_base rf2o_fix republishes it corrected as odom_lidar (the EKF's motion input).
/**:
  ros__parameters:
    laser_scan_topic: /scan_rf2o   # 2026-10-12: /scan without the self-returns (lidar_reader); rf2o ignores range_min
    odom_topic: /odom_rf2o
    publish_tf: false
    base_frame_id: laser        # 2026-09-30: odometry OF THE LASER; no TF lookup at start (it raced the static TF -> sign flipped per boot). rf2o_fix converts to base_link.
    odom_frame_id: odom_rf2o
    init_pose_from_topic: ""
    freq: 10.0
